# Deploy automatico das Edge Functions do Supabase.
#
# Dispara quando: push pra main que altere algo em supabase/functions/.
# Resultado: codigo das edge functions atualizado no Supabase Cloud em ~1min.
#
# Pre-requisitos (configurar uma vez nos Secrets do repo):
#   SUPABASE_ACCESS_TOKEN  - Personal Access Token gerado em
#                             https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   - ref do projeto Supabase (na URL do dashboard).
#
# Migrations SQL NAO entram aqui de proposito — sao aplicadas manualmente
# no SQL Editor pra forcar revisao humana antes de tocar o schema. Ver
# docs/ci-cd-setup.md.

name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # RH_BASE_URL versionada em vez de invisivel no dashboard.
      #
      # Por que: este valor ficou apontando pra https://rh.investmoneysa.com.br depois que o
      # SistemadeRH mudou pra https://solumn.com.br. O subdominio antigo virou NXDOMAIN e o
      # formulario publico de negociacao caiu INTEIRO — o corretor via "Falha no upload de creci
      # (HTTP 500)" e culpava o proprio arquivo. Como o valor so existia num campo do dashboard,
      # nada no repo denunciava que estava morto e ninguem revisava.
      #
      # NAO e segredo: e uma URL publica. Versionar aqui torna a mudanca de endereco um diff
      # revisavel, com data e motivo, em vez de uma edicao silenciosa.
      # Verificado 2026-08-13: /api/rota-inexistente -> 404, /api/cadastro-negociacao/upload
      # (GET) -> 405, /cadastro-colaborador -> 200.
      - name: Configurar RH_BASE_URL (endereco do SistemadeRH)
        run: supabase secrets set RH_BASE_URL=https://solumn.com.br --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy sienge-sync
        run: supabase functions deploy sienge-sync --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Gestao de acesso do CORRETOR. --no-verify-jwt porque o preflight OPTIONS do
      # browser nao leva Authorization; a autenticacao (JWT + tipo='admin') e feita
      # dentro da propria funcao. Mesmo desenho de admin-cliente-acesso.
      - name: Deploy admin-corretor-acesso
        run: supabase functions deploy admin-corretor-acesso --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
